name: Live phone test

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions: {}

jobs:
  live-call:
    # This calls the deployed service using the trusted base revision.
    # Never check out the PR head or execute commands from the PR payload.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: phone-e2e
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          python-version: "3.13"
          version: "0.7.19"
          enable-cache: false
      - run: uv sync --locked --group dev
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_LOG_READER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Verify unlock digit on a real call
        env:
          E2E_LOG_VIEW: projects/operator9/locations/global/buckets/op9-e2e-receipts/views/receipts
          RUN_PHONE_E2E: "1"
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_API_KEY: ${{ secrets.TWILIO_API_KEY }}
          TWILIO_API_SECRET: ${{ secrets.TWILIO_API_SECRET }}
          E2E_CALLER_NUMBER: ${{ secrets.E2E_CALLER_NUMBER }}
          E2E_SERVICE_NUMBER: ${{ secrets.E2E_SERVICE_NUMBER }}
          E2E_PASSCODE: ${{ secrets.E2E_PASSCODE }}
          E2E_CALLBACK_URL: ${{ vars.E2E_CALLBACK_URL }}
        run: uv run --no-sync pytest tests/test_phone_e2e.py -q -s --tb=line --show-capture=no

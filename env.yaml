# Non-secret Cloud Run config. Safe to commit.
#
# Everything sensitive lives in Secret Manager and is injected at deploy time
# with --set-secrets:
#
#   ANTHROPIC_API_KEY   -> anthropic-api-key
#   TWILIO_AUTH_TOKEN   -> twilio-auth-token
#   AGENT_CONTEXT       -> agent-context
#   AGENT_PEOPLE        -> agent-people        (voice-agent-people)
#   TWILIO_ACCOUNT_SID  -> twilio-account-sid   (post-call SMS)
#   NOTIFY_SMS_TO       -> notify-sms-to        (post-call SMS)
#
# AGENT_CONTEXT is a secret and not a config value on purpose. The gate's whole
# security model is that a stranger cannot look those facts up — committing them
# to git would put them in every clone and every CI log, which is the same leak
# as posting them on LinkedIn. Keeping them in Secret Manager also means you can
# rotate a fact that has gone stale without touching the code.
#
# AGENT_PEOPLE is more sensitive still: it holds each person's door code, so it
# is a credential store, not just private trivia. Same reasoning, higher stakes.
#
# See the README for the deploy command.

# Shared-passcode mode: no LLM, every visitor types the same DTMF code. Set to
# "voice-agent-people" for the per-person challenge with per-person codes, or
# "voice-agent" for the single shared resident-facts challenge.
MODE: "voice-agent-people"
# Logs the raw DTMF digits Twilio decoded — i.e. the passcode, in plaintext, on
# every call. Turn on only for a test window to diagnose a panel that garbles
# tones, then turn it back off and rotate the code.
DEBUG_DTMF: "false"

OPEN_DIGITS: "ww9"
# Seconds to hold the relay socket open after sending the door tones. Twilio
# plays sendDigits asynchronously, so hanging up immediately truncates them and
# the door never trips. Raise this if the door still fails to open.
OPEN_DIGITS_SETTLE: "3"
RECORD_CALLS: "true"

AGENT_MODEL: "claude-haiku-4-5"
# Must ask for a NAME in voice-agent-people mode: the visitor's first utterance
# is the only thing the roster classifier sees.
AGENT_GREETING: "Hello, who's there?"
AGENT_MAX_TURNS: "6"

# voice-agent-people only. One code attempt, and a per-digit idle timeout —
# Twilio sends one frame per keypress and never says "done", so the buffer
# needs its own clock.
AGENT_CODE_ATTEMPTS: "1"
AGENT_CODE_TIMEOUT: "10"

# Seconds to keep the call open waiting for a YES/NO text when an unknown
# visitor buzzes. Past this the door stays shut.
AGENT_APPROVAL_TIMEOUT: "60"

# ElevenLabs via ConversationRelay. Format: voiceId-model-speed_stability_similarity
AGENT_TTS_PROVIDER: "ElevenLabs"
AGENT_VOICE: "fBD19tfE58bkETeiwUoC-turbo_v2_5-0.9_0.7_0.8"
